version: '3.8'

services:
  task_runner:
    build: .
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=INFO
      - EXTERNAL_SERVICE_TIMEOUT=3 # example of an async dependency
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./app_files:/app/app_files
      - ./src:/app/src   # hot-reload
      - ./tests:/app/tests # hot-reload

    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile.bot
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - API_URL=${API_URL}
    volumes:
      - ./bot/bot.py:/app/bot.py:ro
    restart: unless-stopped
    depends_on:
      - task_runner


      

    
    