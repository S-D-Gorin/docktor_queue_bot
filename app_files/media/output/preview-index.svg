    <text x="600" y="480" font-family="Arial" font-size="60" text-anchor="middle" fill="#6fb3b8">📄</text>
    <text x="800" y="480" font-family="Arial" font-size="60" text-anchor="middle" fill="#ff7e67">🎨</text>
    
    <!-- URL -->
    <text x="600" y="550" font-family="Monospace" font-size="18" text-anchor="middle" fill="#666">
