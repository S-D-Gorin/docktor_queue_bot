<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#2c7873;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#6fb3b8;stop-opacity:1" />
        </linearGradient>
    </defs>
    
    <rect width="1200" height="630" fill="url(#bg)"/>
    
    <!-- Декоративные элементы -->
    <circle cx="200" cy="150" r="60" fill="white" opacity="0.1"/>
    <circle cx="1000" cy="500" r="80" fill="white" opacity="0.1"/>
    <path d="M100,400 Q250,300 400,450" stroke="white" stroke-width="2" opacity="0.2" fill="none"/>
    
    <!-- Основной контент -->
    <rect x="100" y="100" width="1000" height="430" rx="20" fill="white" opacity="0.9"/>
    
    <!-- Заголовок -->
    <text x="600" y="220" font-family="Georgia, serif" font-size="48" text-anchor="middle" fill="#2c7873" font-weight="bold">
        Sīmulacrum Medicālis
    </text>
    
    <!-- Подзаголовок -->
    <text x="600" y="280" font-family="Georgia, serif" font-size="28" text-anchor="middle" fill="#6fb3b8" font-style="italic">
